<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>Competition Details | RoboCupJunior Canada</title>
  <link rel="stylesheet" href="competition.css" />
</head>
<body>
  <nav>
    <div class="container nav-inner">
      <a id="home-link" href="index.html" class="logo">
        <div class="logo-circle">&#129302;</div>
        <div>
          RoboCupJunior
          <span>Canada</span>
        </div>
      </a>

      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <header class="hero">
    <div class="container hero-inner">
      <div>
        <h1 id="page-title">Competition<span>Details</span></h1>
        <p id="page-summary"></p>
        <a class="btn-primary" id="back-link" href="leagues.html">Back to Leagues &rarr;</a>
      </div>

      <div class="hero-img">
        <img src="images/robocup_white_world-horizontal.png" alt="RoboCup logo" id="hero-image">
      </div>
    </div>
  </header>

  <main id="content"></main>

  <footer id="footer-text">&copy; 2026 RoboCupJunior Canada. All rights reserved.</footer>

  <script>
    (function initializeCompetitionNavigation() {
      const params = new URLSearchParams(window.location.search);
      const type = params.get("type") || "maze";
      const isFrench = params.get("lang") === "fr";
      const navigation = isFrench
        ? [
            ["Accueil", "index_fr.html"],
            ["À propos", "about_fr.html"],
            ["Ligues et règles", "leagues_fr.html"],
            ["Inscription en ligne", "registration_fr.html"],
            ["Calendrier", "schedule_fr.html"],
            ["Galerie internationale", "gallery_fr.html"],
            ["Ressources", "resources_fr.html"],
            ["Contact", "contact_fr.html"],
            ["English", `competition.html?lang=en&type=${encodeURIComponent(type)}`]
          ]
        : [
            ["Homepage", "index.html"],
            ["About Us", "about.html"],
            ["Leagues & Rules", "leagues.html"],
            ["Online Registration", "registration.html"],
            ["Competition Schedule", "schedule.html"],
            ["International Image Gallery", "gallery.html"],
            ["RoboCup Community Resources", "resources.html"],
            ["Contact Us", "contact.html"],
            ["Admin", "admin/index.html"],
            ["Français", `competition.html?lang=fr&type=${encodeURIComponent(type)}`]
          ];

      document.documentElement.lang = isFrench ? "fr" : "en";
      document.getElementById("home-link").href = isFrench ? "index_fr.html" : "index.html";
      document.getElementById("nav-links").innerHTML = navigation.map(([label, href]) => {
        const active = label.includes("League") || label.includes("Ligue") ? " active" : "";
        return `<a class="nav-link${active}" href="${href}">${label}</a>`;
      }).join("");
      document.getElementById("footer-text").textContent = isFrench
        ? "© 2026 RoboCup Junior Canada. Tous droits réservés."
        : "© 2026 RoboCup Junior Canada. All rights reserved.";
    })();
  </script>
  <script src="site-settings.js"></script>
</body>
</html>
